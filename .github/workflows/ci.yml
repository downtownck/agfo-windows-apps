name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Ortak modul kopyalari ayni mi
        run: |
          cmp shared/agfo_github_update.py system-care/agfo_github_update.py
          cmp shared/agfo_github_update.py supertools/agfo_github_update.py
          cmp shared/agfo_github_update.py backupsync/src/agfo_github_update.py
          cmp shared/agfo_github_update.py ai-editor/src/agfo_github_update.py
          cmp shared/agfo_github_update.py phantom-shot/agfo_github_update.py
          cmp shared/agfo_github_update.py mic-monitor/agfo_github_update.py
          cmp shared/agfo_github_update.py subscription-manager/agfo_github_update.py
          for f in scanner_core.py supertools_core.py supertools_ui.py ssh_profiles.py ssh_password_vault.py ssh_password_transport.py ssh_workspace.py; do
            cmp supertools/$f system-care/$f
          done
      - name: Gizlilik denetimi (kisisel kayitlar acik depoya giremez)
        run: python -I .github/scripts/privacy_check.py .
      - name: Testler
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          python -I shared/tests/test_agfo_github_update.py shared
          python -I system-care/tests/test_core.py system-care
          python -I system-care/tests/test_runner_stream.py system-care
          xvfb-run -a python -I system-care/tests/test_gui_nav.py system-care classic
          python -m pip install --quiet 'ttkbootstrap==2.2.7'
          xvfb-run -a python -I system-care/tests/test_gui_nav.py system-care modern
          python -I phantom-shot/tests/test_core.py phantom-shot
          python -I phantom-shot/tests/test_update.py phantom-shot
          python -I phantom-shot/tests/test_triggers.py phantom-shot
          python -m pip install --quiet 'numpy>=1.26,<3' 'soundfile>=0.13,<0.15' 'Pillow>=11,<14'
          python -I mic-monitor/tests/test_core.py mic-monitor
          python -I mic-monitor/tests/test_update.py mic-monitor
          python -I mic-monitor/tests/test_engine.py mic-monitor
          python -I mic-monitor/tests/test_fx.py mic-monitor
          python -I mic-monitor/tests/test_backing.py mic-monitor
          python -I mic-monitor/tests/test_lyrics.py mic-monitor
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -I mic-monitor/tests/test_media.py mic-monitor
          xvfb-run -a python -I mic-monitor/tests/test_gui.py mic-monitor
          python -I subscription-manager/tests/test_core.py subscription-manager
          xvfb-run -a python -I subscription-manager/tests/test_gui.py subscription-manager
          python -m compileall -q supertools system-care backupsync/src phantom-shot mic-monitor subscription-manager
          mkdir -p /tmp/st && xvfb-run -a python -I supertools/tests/test_github_update_gui.py supertools /tmp/st
          python -m unittest discover -s backupsync/tests
          python -m pip install --quiet 'pypdf>=6,<7' 'pypdfium2>=4.30,<6' 'Pillow>=11,<13' 'cryptography>=42,<47' 'fonttools>=4.50,<5' 'lxml>=5.2,<7'
          xvfb-run -a python -m unittest discover -s ai-editor/tests > /tmp/editor-tests.txt 2>&1 || {
            tail -200 /tmp/editor-tests.txt
            # annotations are readable through the REST API even when raw logs are not
            python - <<'PY'
          import re
          t = open('/tmp/editor-tests.txt', encoding='utf-8', errors='replace').read()
          blocks = re.findall(r'^(?:FAIL|ERROR): .*?(?=^(?:FAIL|ERROR): |^-{20,}\nRan |\Z)', t, re.S | re.M) or [t[-6000:]]
          for i, b in enumerate(blocks[:8]):
              msg = b[-3500:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::error title=ai-editor tests %d::%s' % (i + 1, msg))
          PY
            exit 1
          }
          tail -3 /tmp/editor-tests.txt

  ai-manager-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP ayrisma + testler
        working-directory: ai-manager
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/lint.txt || { grep -v '^No syntax errors' /tmp/lint.txt; exit 1; }
          for t in tests/*-tests.php; do php "$t" > /tmp/t.txt || { cat /tmp/t.txt; echo "FAIL $t"; exit 1; }; echo "$t: $(tail -1 /tmp/t.txt)"; done

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: PowerShell ayrisma
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e.Count) { Write-Host "HATA $($_.FullName): $($e[0].Message)"; $bad++ } }
          if ($bad) { exit 1 }
      - name: BackupSync testleri
        run: python -m unittest discover -s backupsync/tests
      - name: BackupSync GUI duman testi (koyu tema, 6 sekme)
        shell: pwsh
        run: |
          $env:AGFO_GUI_SMOKE = '1'
          $env:AGFO_GUI_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'gui.png'
          $o = powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File backupsync/payload/AGFO-BackupSync-GUI.ps1 | Out-String
          Write-Host $o
          if ($o -notmatch 'AGFO GUI SMOKE OK: AgfoUi\.DarkTabControl') { throw 'GUI duman testi basarisiz' }
      - name: System Care gercek Windows testi (PowerShell eylemleri + uctan uca arayuz)
        shell: pwsh
        run: |
          python --version
          python -I system-care/tests/test_core.py system-care
          python -I system-care/tests/test_windows.py system-care

  system-care-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Hazir calisma ortamini derle (Python'suz kurulum)
        run: |
          python -m pip install --quiet --disable-pip-version-check pyinstaller ttkbootstrap==2.2.7 pillow paramiko pypdf
          python system-care/packaging/build_runtime.py system-care dist-rt
      - name: Exe oz-denetimi (21 sayfa, modern gorunum, gomulu kutuphaneler)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $env:AGFO_SELFTEST = $out
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'lad'
          $p = Start-Process -FilePath 'dist-rt\AGFO System Care\AGFO System Care.exe' -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw 'zaman asimi' }
          if (-not (Test-Path $out)) { throw 'oz-denetim dosyasi yok' }
          $t = Get-Content $out -Raw; Write-Host $t
          if ($t -notmatch '^OK \S+ pages=21 ui=modern frozen=True mods=ttkbootstrap PIL paramiko') { throw 'oz-denetim basarisiz' }
          Get-ChildItem 'dist-rt\AGFO System Care' | Select-Object Name, Length | Format-Table | Out-String | Write-Host
