name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Ortak modul kopyalari ayni mi
        run: |
          cmp shared/agfo_github_update.py system-care/agfo_github_update.py
          cmp shared/agfo_github_update.py supertools/agfo_github_update.py
          cmp shared/agfo_github_update.py backupsync/src/agfo_github_update.py
          cmp shared/agfo_github_update.py ai-editor/src/agfo_github_update.py
      - name: Testler
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          python -I shared/tests/test_agfo_github_update.py shared
          python -I system-care/tests/test_core.py system-care
          python -I system-care/tests/test_runner_stream.py system-care
          python -m compileall -q supertools system-care backupsync/src
          mkdir -p /tmp/st && xvfb-run -a python -I supertools/tests/test_github_update_gui.py supertools /tmp/st
          python -m unittest discover -s backupsync/tests
          xvfb-run -a python -m unittest discover -s ai-editor/tests

  ai-manager-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP ayrisma + testler
        working-directory: ai-manager
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/lint.txt || { grep -v '^No syntax errors' /tmp/lint.txt; exit 1; }
          for t in tests/*-tests.php; do php "$t" > /tmp/t.txt || { cat /tmp/t.txt; echo "FAIL $t"; exit 1; }; echo "$t: $(tail -1 /tmp/t.txt)"; done

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: PowerShell ayrisma
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e.Count) { Write-Host "HATA $($_.FullName): $($e[0].Message)"; $bad++ } }
          if ($bad) { exit 1 }
      - name: BackupSync testleri
        run: python -m unittest discover -s backupsync/tests
      - name: BackupSync GUI duman testi (koyu tema, 6 sekme)
        shell: pwsh
        run: |
          $env:AGFO_GUI_SMOKE = '1'
          $env:AGFO_GUI_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'gui.png'
          $o = powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File backupsync/payload/AGFO-BackupSync-GUI.ps1 | Out-String
          Write-Host $o
          if ($o -notmatch 'AGFO GUI SMOKE OK: AgfoUi\.DarkTabControl') { throw 'GUI duman testi basarisiz' }
