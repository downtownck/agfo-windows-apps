name: Smart Organizer Windows EXE
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/smart-organizer-v1.0.0
    paths:
      - 'smart-organizer/**'
      - '.github/workflows/smart-organizer-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: smart-organizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyinstaller pypdf
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows EXE
        run: python -m PyInstaller --onefile --windowed --clean --noconfirm --name AGFO-Smart-Organizer --collect-all pypdf smart_organizer.pyw
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGFO-Smart-Organizer-Windows
          path: smart-organizer/dist/AGFO-Smart-Organizer.exe
