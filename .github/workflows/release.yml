name: Release

# main'e gonderilen kodda bir uygulamanin surum numarasi yukselmisse ve o surumun etiketi henuz yoksa,
# ilgili uygulama test edilir, paketlenir ve GitHub Release (etiketiyle birlikte) olarak yayinlanir.
#   system-care-vX.Y.Z  -> AGFO-System-Care-vX.Y.Z.zip (uygulama ici guncelleme paketi, MANIFEST'li)
#   supertools-vX.Y.Z   -> AGFO-SuperTools-vX.Y.Z.update.zip (Guncelleme Merkezi paketi) + tam kurulum ZIP'i
#   backupsync-vX.Y.Z   -> AGFO-BackupSync-Setup.exe + AGFO-BackupSync.exe (Windows'ta derlenir) + kaynak ZIP
#   ai-manager-vX.Y.Z   -> agfo-ai-manager-X.Y.Z.zip (WordPress eklentisi; siteler GitHub'dan gunceller)
#   ai-editor-vX.Y.Z    -> AGFO-AI-Editor.exe (Windows'ta derlenir) + ekran goruntusu
# Her surume SHA256SUMS.txt eklenir; uygulamalar indirdikleri dosyayi bununla / GitHub ozetiyle dogrular.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      sc: ${{ steps.d.outputs.sc }}
      st: ${{ steps.d.outputs.st }}
      bs: ${{ steps.d.outputs.bs }}
      am: ${{ steps.d.outputs.am }}
      ae: ${{ steps.d.outputs.ae }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          need() { if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$1" > /dev/null 2>&1; then echo ""; else echo "$1"; fi; }
          SC=$(sed -n "s/^VERSION = '\([0-9.]*\)'/\1/p" system-care/care_core.py)
          ST=$(sed -n 's/^APP_VERSION = "\([0-9.]*\)"/\1/p' supertools/scanner_core.py)
          BS=$(sed -n "s/^VERSION = '\([0-9.]*\)'/\1/p" backupsync/src/agfo_installer.py)
          echo "sc=$(need system-care-v$SC)" >> "$GITHUB_OUTPUT"
          echo "st=$(need supertools-v$ST)" >> "$GITHUB_OUTPUT"
          echo "bs=$(need backupsync-v$BS)" >> "$GITHUB_OUTPUT"
          AM=$(sed -n "s/^define('AGFO_AIM_VERSION', *'\([0-9.]*\)');/\1/p" ai-manager/agfo-ai-manager.php)
          AE=$(sed -n "s/^VERSION = '\([0-9.]*\)'/\1/p" ai-editor/src/agfo_editor_core.py)
          echo "am=$(need ai-manager-v$AM)" >> "$GITHUB_OUTPUT"
          echo "ae=$(need ai-editor-v$AE)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  system-care:
    needs: detect
    if: needs.detect.outputs.sc != ''
    runs-on: ubuntu-latest
    env: { TAG: '${{ needs.detect.outputs.sc }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Surum / etiket ve ortak modul denetimi
        run: |
          V="${TAG#system-care-v}"
          C=$(sed -n "s/^VERSION = '\([0-9.]*\)'/\1/p" system-care/care_core.py)
          [ "$V" = "$C" ] || { echo "Etiket $V ile care_core.py VERSION $C uyusmuyor"; exit 1; }
          cmp shared/agfo_github_update.py system-care/agfo_github_update.py
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Testler
        run: |
          python -I shared/tests/test_agfo_github_update.py shared
          python -I system-care/tests/test_core.py system-care
          python -I system-care/tests/test_runner_stream.py system-care
      - name: Paketle
        run: |
          mkdir -p out pkg
          rsync -a --exclude '__pycache__' system-care/ pkg/agfo-care/
          python pkg/agfo-care/packaging/build_update_manifest.py pkg/agfo-care
          rm -rf pkg/agfo-care/__pycache__
          (cd pkg && zip -qr "../out/AGFO-System-Care-v${VERSION}.zip" agfo-care)
          python -I -c "import sys; sys.path.insert(0,'system-care'); import care_core as c; i=c.inspect_update('out/AGFO-System-Care-v${VERSION}.zip','0'); assert i['ok'] and i['manifest'] and i['version']=='${VERSION}', i; print('paket dogrulandi', i['version'])"
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Yayinla
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES=".github/release-notes/${TAG}.md"; [ -f "$NOTES" ] || { echo "AGFO System Care ${VERSION}" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          gh release create "$TAG" out/* --title "AGFO System Care ${VERSION}" --notes-file "$NOTES" --target "$GITHUB_SHA"

  supertools:
    needs: detect
    if: needs.detect.outputs.st != ''
    runs-on: ubuntu-latest
    env: { TAG: '${{ needs.detect.outputs.st }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Surum / etiket ve ortak modul denetimi
        run: |
          V="${TAG#supertools-v}"
          C=$(sed -n 's/^APP_VERSION = "\([0-9.]*\)"/\1/p' supertools/scanner_core.py)
          [ "$V" = "$C" ] || { echo "Etiket $V ile scanner_core.py APP_VERSION $C uyusmuyor"; exit 1; }
          cmp shared/agfo_github_update.py supertools/agfo_github_update.py
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Testler
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          python -I shared/tests/test_agfo_github_update.py shared
          python -m compileall -q supertools
          mkdir -p /tmp/st && xvfb-run -a python -I supertools/tests/test_github_update_gui.py supertools /tmp/st
      - name: Paketle
        run: |
          mkdir -p out pkg
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then N=$(python -I -c "import sys; print(open(sys.argv[1], encoding='utf-8').read()[:2400])" "$NOTES"); else N="AGFO SuperTools ${VERSION}"; fi
          python -I supertools/packaging/create_update.py --source supertools --output "out/AGFO-SuperTools-v${VERSION}.update.zip" --notes "$N"
          rsync -a --exclude '__pycache__' --exclude 'tests' supertools/ "pkg/AGFO-SuperTools-v${VERSION}/"
          (cd pkg && zip -qr "../out/AGFO-SuperTools-v${VERSION}-Kurulum.zip" "AGFO-SuperTools-v${VERSION}")
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Yayinla
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES=".github/release-notes/${TAG}.md"; [ -f "$NOTES" ] || { echo "AGFO SuperTools ${VERSION}" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          gh release create "$TAG" out/* --title "AGFO SuperTools ${VERSION}" --notes-file "$NOTES" --target "$GITHUB_SHA"

  backupsync:
    needs: detect
    if: needs.detect.outputs.bs != ''
    runs-on: windows-latest
    env: { TAG: '${{ needs.detect.outputs.bs }}' }
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Surum / etiket ve ortak modul denetimi
        run: |
          $v = $env:TAG -replace '^backupsync-v',''
          $c = (Select-String -Path backupsync/src/agfo_installer.py -Pattern "^VERSION = '([0-9.]+)'").Matches[0].Groups[1].Value
          if ($v -ne $c) { throw "Etiket $v ile agfo_installer.py VERSION $c uyusmuyor" }
          if ((Get-FileHash shared/agfo_github_update.py).Hash -ne (Get-FileHash backupsync/src/agfo_github_update.py).Hash) { throw 'Ortak modul kopyasi farkli' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Ortak modul testi
        run: python -I shared/tests/test_agfo_github_update.py shared
      - name: Derle (PowerShell ayrisma + PS testleri + unittest + PyInstaller)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File backupsync/packaging/build_windows.ps1
      - name: GUI duman testi (AGFO koyu tema) + ekran goruntusu
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $env:AGFO_GUI_SMOKE = '1'
          $env:AGFO_GUI_SMOKE_OUT = (Join-Path (Resolve-Path out) "AGFO-BackupSync-v$env:VERSION-ekran.png")
          $o = powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File backupsync/payload/AGFO-BackupSync-GUI.ps1 | Out-String
          Write-Host $o
          if ($o -notmatch 'AGFO GUI SMOKE OK: AgfoUi\.DarkTabControl') { throw 'GUI duman testi basarisiz' }
          if (-not (Test-Path $env:AGFO_GUI_SMOKE_OUT)) { throw 'Ekran goruntusu yok' }
      - name: Yardimci exe - sizan PyInstaller ortaminda calisiyor mu
        run: |
          $exe = (Resolve-Path backupsync/dist/AGFO-BackupSync.exe).Path
          $json = Join-Path $env:RUNNER_TEMP 'drive.json'
          $env:_PYI_ARCHIVE_FILE = $exe
          $env:_PYI_APPLICATION_HOME_DIR = 'C:\nonexistent\_MEI000108b02'
          $env:_PYI_PARENT_PROCESS_LEVEL = '1'
          $env:_MEIPASS2 = 'C:\nonexistent\_MEI000108b02'
          $env:PYINSTALLER_RESET_ENVIRONMENT = '1'
          $p = Start-Process -FilePath $exe -ArgumentList @('--output', "`"$json`"", '--drive-list') -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Yardimci exe zaman asimi' }
          if (-not (Test-Path $json)) { throw ('Yardimci exe sonuc yazmadi, cikis kodu ' + $p.ExitCode) }
          Get-Content $json -Raw
      - name: Paketle
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item backupsync/dist/AGFO-BackupSync-Setup.exe out/
          Copy-Item backupsync/dist/AGFO-BackupSync.exe out/
          $src = "AGFO-BackupSync-v$env:VERSION-Kaynak"
          New-Item -ItemType Directory -Force "pkg/$src" | Out-Null
          Copy-Item -Recurse backupsync/* "pkg/$src/" -Exclude dist,.build-logs,__pycache__
          Compress-Archive -Path "pkg/$src" -DestinationPath "out/$src.zip"
          Get-ChildItem out -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt
      - name: Yayinla
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $notes = ".github/release-notes/$env:TAG.md"
          if (-not (Test-Path $notes)) { "AGFO BackupSync $env:VERSION" | Set-Content notes.md; $notes = 'notes.md' }
          gh release create $env:TAG (Get-ChildItem out -File).FullName --title "AGFO BackupSync $env:VERSION" --notes-file $notes --target $env:GITHUB_SHA

  ai-manager:
    needs: detect
    if: needs.detect.outputs.am != ''
    runs-on: ubuntu-latest
    env: { TAG: '${{ needs.detect.outputs.am }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Surum / etiket denetimi
        run: |
          V="${TAG#ai-manager-v}"
          C=$(sed -n "s/^define('AGFO_AIM_VERSION', *'\([0-9.]*\)');/\1/p" ai-manager/agfo-ai-manager.php)
          H=$(sed -n 's/^ \* Version: *\([0-9.]*\).*/\1/p' ai-manager/agfo-ai-manager.php)
          [ "$V" = "$C" ] && [ "$V" = "$H" ] || { echo "Etiket $V / AGFO_AIM_VERSION $C / baslik $H uyusmuyor"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: PHP ayrisma + testler
        working-directory: ai-manager
        run: |
          php -v | head -1
          find . -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/lint.txt || { grep -v '^No syntax errors' /tmp/lint.txt; exit 1; }
          for t in tests/*-tests.php; do echo "== $t"; php "$t" | tail -3 || exit 1; php "$t" > /dev/null || { echo "FAIL $t"; exit 1; }; done
      - name: Paketle
        run: |
          mkdir -p out pkg
          rsync -a --exclude '.git' ai-manager/ pkg/agfo-ai-manager/
          (cd pkg && zip -qr "../out/agfo-ai-manager-${VERSION}.zip" agfo-ai-manager)
          unzip -l "out/agfo-ai-manager-${VERSION}.zip" | grep -q 'agfo-ai-manager/agfo-ai-manager.php'
          unzip -l "out/agfo-ai-manager-${VERSION}.zip" | grep -q 'agfo-ai-manager/includes/core/class-github-updater.php'
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Yayinla
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES=".github/release-notes/${TAG}.md"; [ -f "$NOTES" ] || { echo "AGFO AI Manager ${VERSION}" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          gh release create "$TAG" out/* --title "AGFO AI Manager ${VERSION}" --notes-file "$NOTES" --target "$GITHUB_SHA"

  ai-editor:
    needs: detect
    if: needs.detect.outputs.ae != ''
    runs-on: windows-latest
    env: { TAG: '${{ needs.detect.outputs.ae }}' }
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Surum / etiket ve ortak modul denetimi
        run: |
          $v = $env:TAG -replace '^ai-editor-v',''
          $c = (Select-String -Path ai-editor/src/agfo_editor_core.py -Pattern "^VERSION = '([0-9.]+)'").Matches[0].Groups[1].Value
          if ($v -ne $c) { throw "Etiket $v ile agfo_editor_core.py VERSION $c uyusmuyor" }
          if ((Get-FileHash shared/agfo_github_update.py).Hash -ne (Get-FileHash ai-editor/src/agfo_github_update.py).Hash) { throw 'Ortak modul kopyasi farkli' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Derle (testler + PyInstaller + EXE oz-testi)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ai-editor/packaging/build_windows.ps1
      - name: Guncelleyici gercek testi (eski surum acikken EXE degistirme + yeniden baslatma)
        run: |
          $exe = (Resolve-Path ai-editor/dist/AGFO-AI-Editor.exe).Path
          $t = Join-Path $env:RUNNER_TEMP 'upd-test'
          New-Item -ItemType Directory -Force $t | Out-Null
          $target = Join-Path $t 'AGFO-AI-Editor.exe'
          Copy-Item -LiteralPath $exe -Destination $target
          (Get-Item -LiteralPath $target).LastWriteTime = (Get-Date).AddDays(-3)
          $before = (Get-Item -LiteralPath $target).LastWriteTimeUtc
          $old = Start-Process -FilePath $target -PassThru
          Start-Sleep -Seconds 10
          $child = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($old.Id)" | Where-Object Name -eq 'AGFO-AI-Editor.exe' | Select-Object -First 1
          $waitPid = if ($child) { [int]$child.ProcessId } else { $old.Id }
          Write-Host "old app parent=$($old.Id) python=$waitPid"
          $u = Start-Process -FilePath $exe -ArgumentList @('--apply-update', ('"' + $target + '"'), '--wait-pid', $waitPid) -PassThru
          Start-Sleep -Seconds 5
          if ($u.HasExited) { throw ('updater exited early: ' + $u.ExitCode) }
          Stop-Process -Id $waitPid -Force            # the user closes the old version
          if (-not $u.WaitForExit(150000)) { throw 'updater timeout' }
          $log = Join-Path $env:LOCALAPPDATA 'AGFO-AI-Editor\update-log.txt'
          if (Test-Path $log) { Get-Content $log }
          if ($u.ExitCode -ne 0) { throw ('updater exit code ' + $u.ExitCode) }
          $after = (Get-Item -LiteralPath $target).LastWriteTimeUtc
          if ($after -le $before) { throw 'target was not replaced' }
          if ((Get-FileHash $target).Hash -ne (Get-FileHash $exe).Hash) { throw 'target content differs' }
          Start-Sleep -Seconds 8
          $relaunched = @(Get-CimInstance Win32_Process -Filter "Name='AGFO-AI-Editor.exe'" | Where-Object { $_.ExecutablePath -eq $target })
          Write-Host ('relaunched processes: ' + $relaunched.Count)
          if (-not $relaunched.Count) { throw 'new version was not relaunched' }
          Get-Process AGFO-AI-Editor -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Select-String -Path $log -Pattern 'Update applied' -Quiet)) { throw 'no success line in log' }
      - name: Arayuz duman testi + ekran goruntusu
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $png = Join-Path (Resolve-Path out) "AGFO-AI-Editor-v$env:VERSION-ekran.png"
          $o = python ai-editor/src/agfo_ai_editor.pyw --smoke $png | Out-String
          Write-Host $o
          if ($o -notmatch 'AGFO EDITOR SMOKE OK') { throw 'GUI duman testi basarisiz' }
          if (-not (Test-Path $png)) { throw 'Ekran goruntusu yok' }
      - name: Paketle
        run: |
          Copy-Item ai-editor/dist/AGFO-AI-Editor.exe out/
          Get-ChildItem out -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt
      - name: Yayinla
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $notes = ".github/release-notes/$env:TAG.md"
          if (-not (Test-Path $notes)) { "AGFO AI Editor $env:VERSION" | Set-Content notes.md; $notes = 'notes.md' }
          gh release create $env:TAG (Get-ChildItem out -File).FullName --title "AGFO AI Editor $env:VERSION" --notes-file $notes --target $env:GITHUB_SHA
