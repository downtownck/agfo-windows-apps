  subscription-manager:
    needs: detect
    if: needs.detect.outputs.sm != ''
    runs-on: ubuntu-latest
    env: { TAG: '${{ needs.detect.outputs.sm }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Surum / etiket ve ortak modul denetimi
        run: |
          V="${TAG#subscription-manager-v}"
          C=$(sed -n "s/^VERSION = '\([0-9.]*\)'/\1/p" subscription-manager/subscription_core.py)
          [ "$V" = "$C" ] || { echo "Etiket $V ile subscription_core.py VERSION $C uyusmuyor"; exit 1; }
          cmp shared/agfo_github_update.py subscription-manager/agfo_github_update.py
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Testler
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          python -I shared/tests/test_agfo_github_update.py shared
          python -I subscription-manager/tests/test_core.py subscription-manager
          xvfb-run -a python -I subscription-manager/tests/test_gui.py subscription-manager
      - name: Paketle
        run: |
          mkdir -p out pkg
          D="AGFO-Subscription-Manager-v${VERSION}"
          rsync -a --exclude '__pycache__' --exclude 'dist' subscription-manager/ "pkg/$D/"
          test -f "pkg/$D/Derle-ve-Kur.cmd"
          (cd pkg && zip -qr "../out/$D-Kurulum.zip" "$D")
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Yayinla
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NOTES=".github/release-notes/${TAG}.md"; [ -f "$NOTES" ] || { echo "AGFO Subscription Manager ${VERSION}" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          gh release create "$TAG" out/* --title "AGFO Subscription Manager ${VERSION}" --notes-file "$NOTES" --target "$GITHUB_SHA"

  router-connect:
    needs: detect
    if: needs.detect.outputs.rn != ''
    runs-on: windows-latest
    env: { TAG: '${{ needs.detect.outputs.rn }}' }
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Surum / etiket, ortak modul ve gizlilik denetimi
        run: |
          $v = $env:TAG -replace '^router-connect-v',''
          $c = (Select-String -Path router-connect/router_core.py -Pattern "^VERSION = '([0-9.]+)'").Matches[0].Groups[1].Value
          if ($v -ne $c) { throw "Etiket $v ile router_core.py VERSION $c uyusmuyor" }
          if ((Get-FileHash shared/agfo_github_update.py).Hash -ne (Get-FileHash router-connect/agfo_github_update.py).Hash) { throw 'Ortak modul kopyasi farkli' }
          python -X utf8 -I .github/scripts/privacy_check.py .
          if ($LASTEXITCODE) { throw 'gizlilik denetimi basarisiz' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Testler (gercek Windows'ta, WLAN API yapi boyutlari ve arayuz)
        run: |
          python -X utf8 -I shared/tests/test_agfo_github_update.py shared
          if ($LASTEXITCODE) { throw 'ortak modul testi basarisiz' }
          python -X utf8 -I router-connect/tests/test_core.py router-connect
          if ($LASTEXITCODE) { throw 'cekirdek testleri basarisiz' }
          python -X utf8 -I router-connect/tests/test_update.py router-connect
          if ($LASTEXITCODE) { throw "guncelleme testi basarisiz" }
          python -X utf8 -I router-connect/tests/test_gui.py router-connect
          if ($LASTEXITCODE) { throw 'arayuz testi basarisiz' }
      - name: Paketle
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $src = "AGFO-Router-Connect-v$env:VERSION"
          New-Item -ItemType Directory -Force "pkg/$src" | Out-Null
          Get-ChildItem router-connect -Force | Where-Object { $_.Name -notin @('dist', '__pycache__', 'tests') } | Copy-Item -Destination "pkg/$src/" -Recurse -Force
          Get-ChildItem "pkg/$src" -Recurse -Directory -Filter '__pycache__' | Remove-Item -Recurse -Force
          if (-not (Test-Path "pkg/$src/Derle-ve-Kur.cmd")) { throw 'Derle-ve-Kur.cmd pakette yok' }
          Compress-Archive -Path "pkg/$src" -DestinationPath "out/$src-Kurulum.zip"
          Get-ChildItem out -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt
      - name: Yerel derleme yolu testi (Kurulum ZIP'i ac -> build_local.ps1 -> EXE acilis testi)
        run: |
          $zip = (Get-ChildItem out -Filter '*-Kurulum.zip' | Select-Object -First 1).FullName
          $t = Join-Path $env:RUNNER_TEMP 'rc-local'
          Expand-Archive -LiteralPath $zip -DestinationPath $t -Force
          $dir = (Get-ChildItem $t -Directory | Select-Object -First 1).FullName
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dir 'packaging\build_local.ps1')
          if ($LASTEXITCODE) { $l = Join-Path $env:LOCALAPPDATA 'AGFO\RouterConnect\build\last-build.txt'; if (Test-Path $l) { Get-Content $l -Tail 60 }; throw 'build_local.ps1 basarisiz' }
          $exe = Join-Path $dir 'dist\AGFO-Router-Connect.exe'
          if (-not (Test-Path $exe)) { throw 'EXE uretilmedi' }
          # EXE oz-denetimi: tkinter/Tcl-Tk EXE'nin icinde gercekten var mi (pencereli EXE hata verince de ayakta kalir, bu yuzden
          # "calisiyor mu" bakmak yetmez; cikis kodu ve sonuc dosyasi denetlenir).
          $st = Join-Path $env:RUNNER_TEMP 'rc-selftest.txt'
          $p = Start-Process -FilePath $exe -ArgumentList @('--selftest', ('"' + $st + '"')) -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'EXE oz-denetimi zaman asimi' }
          $res = if (Test-Path $st) { Get-Content $st -Raw } else { '(sonuc dosyasi yok)' }
          Write-Host $res
          if ($p.ExitCode -ne 0 -or $res -notmatch '^OK ') { throw ('EXE oz-denetimi basarisiz, cikis ' + $p.ExitCode) }
          # Modern gorunum pakete girmis olmali; girmediyse EXE sessizce klasige duserdi.
          if ($res -notmatch 'ui=modern') { throw 'EXE icinde ttkbootstrap yok (ui=modern degil)' }
          # Normal acilis: Wi-Fi karti olmayan makinede de ayakta kalmali.
          $p2 = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $alive = @(Get-Process -Name 'AGFO-Router-Connect' -ErrorAction SilentlyContinue).Count
          Get-Process -Name 'AGFO-Router-Connect' -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $alive) { throw ('EXE acilista kapandi, cikis kodu ' + $p2.ExitCode) }
          Write-Host 'Yerel derleme yolu dogrulandi.'
      - name: Hazir EXE (sessiz guncelleme) - guncelleyici kipi testi ve SHA-256
        run: |
          $zip = (Get-ChildItem out -Filter '*-Kurulum.zip' | Select-Object -First 1).FullName
          $dir = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'rc-local') -Directory | Select-Object -First 1).FullName
          $exe = Join-Path $dir 'dist\AGFO-Router-Connect.exe'
          # Guncelleyici kipi: yeni EXE, kapanmis bir surecin yerine hedefi degistirip acar (calisan eski surumun yerine gecme).
          $tgt = Join-Path $env:RUNNER_TEMP 'rc-target\AGFO-Router-Connect.exe'
          New-Item -ItemType Directory -Force (Split-Path $tgt) | Out-Null
          Set-Content -Path $tgt -Value 'eski surum' -Encoding ascii
          $p = Start-Process -FilePath $exe -ArgumentList @('--apply-update', ('"' + $tgt + '"'), '--wait-pid', '999999') -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'guncelleyici zaman asimi' }
          if ($p.ExitCode -ne 0) { throw ('guncelleyici basarisiz, cikis ' + $p.ExitCode) }
          if ((Get-FileHash $tgt).Hash -ne (Get-FileHash $exe).Hash) { throw 'hedef EXE yeni surumle degismedi' }
          Start-Sleep -Seconds 6
          $alive = @(Get-Process -Name 'AGFO-Router-Connect' -ErrorAction SilentlyContinue).Count
          Get-Process -Name 'AGFO-Router-Connect' -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $alive) { throw 'guncelleme sonrasi uygulama acilmadi' }
          Copy-Item $exe out/AGFO-Router-Connect.exe
          Get-ChildItem out -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/SHA256SUMS.txt
      - name: Yayinla
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $notes = ".github/release-notes/$env:TAG.md"
          if (-not (Test-Path $notes)) { "AGFO Router Connect $env:VERSION" | Set-Content notes.md; $notes = 'notes.md' }
          gh release create $env:TAG (Get-ChildItem out -File).FullName --title "AGFO Router Connect $env:VERSION" --notes-file $notes --target $env:GITHUB_SHA

